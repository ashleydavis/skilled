#
# Build and unit-test on every push and pull request.
#
# Linux, macOS, and Windows each compile and run `zig build test`. Smoke against the shipped
# binary is the release workflow, not this file.
#
name: CI

env:
  ZIG_VERSION: "0.16.0"

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - main

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: zig build
        run: zig build

      - name: zig build test
        run: zig build test --summary all
